; PlatformIO-Projekt. Der Quellcode liegt in StreamDeck/, damit derselbe Ordner
; auch direkt in der Arduino IDE geöffnet werden kann (StreamDeck/StreamDeck.ino).

[platformio]
src_dir = StreamDeck
default_envs = esp32s3

[env:esp32s3]
; pioarduino-Plattform = Arduino-ESP32 Core 3.x (rgbLedWrite, aktuelle USB-CDC)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; native USB als Hardware-CDC/JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB-CDC über die native Buchse

monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter
